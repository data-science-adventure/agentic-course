    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669" />
    </marker>
  </defs>

  
  <rect width="1400" height="880" fill="url(#bgGrad)" />

  
  <text x="36" y="44" font-size="24" font-weight="800" fill="#0f172a">RAG Core Concepts: Ingestion, Retrieval &amp; Grounded Generation</text>
  <text x="36" y="68" font-size="14" font-weight="500" fill="#475569">LangChain Component Pipeline (Load → Chunk → Embed → Retrieve → Prompt → LLM) with LangGraph Evolution Path</text>
  <rect x="1116" y="26" width="248" height="36" rx="18" fill="#0f172a" />
  <text x="1240" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">Module 04 • RAG Core Summary</text>

  
  
  
  <g filter="url(#cardShadow)">
    <rect x="32" y="92" width="1336" height="252" rx="16" fill="#f8fbff" stroke="#93c5fd" stroke-width="1.5" />
    <path d="M 48 92 H 1352 A 16 16 0 0 1 1368 108 V 138 H 32 V 108 A 16 16 0 0 1 48 92 Z" fill="url(#blueLaneHdr)" />
    <circle cx="58" cy="115" r="13" fill="#1d4ed8" />
    <text x="58" y="120" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">1</text>
    <text x="80" y="120" font-size="14.5" font-weight="700" fill="#1e3a8a">Offline Indexing Pipeline (Build Searchable Knowledge Store)</text>
    <rect x="1120" y="102" width="230" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd" />
    <text x="1235" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Runs When Docs Are Added</text>
  </g>

  
  <rect x="52" y="154" width="224" height="172" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3" />
  <g transform="translate(164, 192)">
    <path d="M -16 -20 H 6 L 16 -10 V 20 H -16 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <path d="M 6 -20 V -10 H 16" fill="none" stroke="#2563eb" stroke-width="2" />
    <line x1="-9" y1="2" x2="9" y2="2" stroke="#3b82f6" stroke-width="1.6" />
    <line x1="-9" y1="9" x2="5" y2="9" stroke="#3b82f6" stroke-width="1.6" />
  </g>
  <text x="164" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1. Document Loader</text>
  <text x="164" y="250" text-anchor="middle" font-size="11" fill="#475569">Ingests raw files &amp; keeps</text>
  <text x="164" y="265" text-anchor="middle" font-size="11" fill="#475569">source / page metadata</text>
  <rect x="68" y="282" width="192" height="28" rx="7" fill="#eff6ff" />
  <text x="164" y="300" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#1d4ed8">PyPDFLoader → Document</text>

  <line x1="276" y1="240" x2="300" y2="240" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="306" y="154" width="224" height="172" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3" />
  <g transform="translate(418, 192)">
    <rect x="-34" y="-17" width="68" height="9" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" />
    <rect x="-34" y="-4" width="68" height="9" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" />
    <rect x="-34" y="9" width="68" height="9" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" />
  </g>
  <text x="418" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2. Text Chunking</text>
  <text x="418" y="250" text-anchor="middle" font-size="11" fill="#475569">Splits into focused chunks</text>
  <text x="418" y="265" text-anchor="middle" font-size="11" fill="#475569">with boundary overlap</text>
  <rect x="322" y="282" width="192" height="28" rx="7" fill="#eff6ff" />
  <text x="418" y="300" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#1d4ed8">RecursiveTextSplitter</text>

  <line x1="530" y1="240" x2="554" y2="240" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="560" y="154" width="224" height="172" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3" />
  <g transform="translate(672, 192)" stroke="#2563eb" stroke-width="1.7" fill="#dbeafe">
    <line x1="-22" y1="-10" x2="0" y2="-13" />
    <line x1="-22" y1="-10" x2="0" y2="11" />
    <line x1="-18" y1="12" x2="0" y2="-13" />
    <line x1="-18" y1="12" x2="0" y2="11" />
    <line x1="0" y1="-13" x2="22" y2="-2" />
    <line x1="0" y1="11" x2="22" y2="-2" />
    <circle cx="-22" cy="-10" r="4" />
    <circle cx="-18" cy="12" r="4" />
    <circle cx="0" cy="-13" r="4" />
    <circle cx="0" cy="11" r="4" />
    <circle cx="22" cy="-2" r="4" />
  </g>
  <text x="672" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3. Dense Embeddings</text>
  <text x="672" y="250" text-anchor="middle" font-size="11" fill="#475569">Maps text to semantic</text>
  <text x="672" y="265" text-anchor="middle" font-size="11" fill="#475569">vectors (solves synonyms)</text>
  <rect x="576" y="282" width="192" height="28" rx="7" fill="#eff6ff" />
  <text x="672" y="300" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#1d4ed8">all-MiniLM-L6-v2 (384d)</text>

  <line x1="784" y1="240" x2="808" y2="240" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="814" y="154" width="256" height="172" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <g transform="translate(942, 192)">
    <path d="M -22 -11 V 12 C -22 18, 22 18, 22 12 V -11 Z" fill="#1d4ed8" />
    <ellipse cx="0" cy="-11" rx="22" ry="7.5" fill="#3b82f6" />
  </g>
  <text x="942" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">4. Vector Database</text>
  <text x="942" y="250" text-anchor="middle" font-size="11" fill="#475569">Indexes 384d vectors, text</text>
  <text x="942" y="265" text-anchor="middle" font-size="11" fill="#475569">&amp; metadata for fast search</text>
  <rect x="830" y="282" width="224" height="28" rx="7" fill="#dbeafe" />
  <text x="942" y="300" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#1e40af">Pinecone • dim=384 • cosine</text>

  <line x1="1070" y1="240" x2="1094" y2="240" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="1100" y="154" width="248" height="172" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3" />
  <circle cx="1224" cy="188" r="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="1224" y="193" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">DB</text>
  <text x="1224" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">5. Persistent Index</text>
  <text x="1224" y="250" text-anchor="middle" font-size="11" fill="#475569">Decouples ingestion cost</text>
  <text x="1224" y="265" text-anchor="middle" font-size="11" fill="#475569">from real-time user queries</text>
  <rect x="1116" y="282" width="216" height="28" rx="7" fill="#eff6ff" />
  <text x="1224" y="300" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Ready for Top-k Lookup</text>

  
  
  
  
  <path d="M 942 326 V 366 H 562 V 476" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arrBlue)" />
  <rect x="614" y="353" width="248" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd" />
  <text x="738" y="369" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Similarity Search Over Indexed Vectors</text>

  
  
  
  <g filter="url(#cardShadow)">
    <rect x="32" y="394" width="1336" height="286" rx="16" fill="#f7fcf9" stroke="#6ee7b7" stroke-width="1.5" />
    <path d="M 48 394 H 1352 A 16 16 0 0 1 1368 410 V 440 H 32 V 410 A 16 16 0 0 1 48 394 Z" fill="url(#greenLaneHdr)" />
    <circle cx="58" cy="417" r="13" fill="#047857" />
    <text x="58" y="422" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">2</text>
    <text x="80" y="422" font-size="14.5" font-weight="700" fill="#064e3b">Online Retrieval &amp; Grounded Generation (Answer User Questions with Evidence)</text>
    <rect x="1120" y="404" width="230" height="26" rx="13" fill="#a7f3d0" stroke="#6ee7b7" />
    <text x="1235" y="421" text-anchor="middle" font-size="11" font-weight="700" fill="#064e3b">Runs Per User Question</text>
  </g>

  
  <rect x="52" y="482" width="194" height="176" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.3" />
  <circle cx="149" cy="516" r="17" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" />
  <circle cx="149" cy="511" r="5" fill="#059669" />
  <path d="M 139 524 C 139 517, 159 517, 159 524" fill="#059669" />
  <text x="149" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">1. User Query</text>
  <text x="149" y="571" text-anchor="middle" font-size="11" fill="#475569">Natural-language question</text>
  <text x="149" y="586" text-anchor="middle" font-size="11" fill="#475569">or domain lookup</text>
  <rect x="66" y="606" width="166" height="32" rx="7" fill="#ecfdf5" />
  <text x="149" y="626" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#065f46">question: str</text>

  <line x1="246" y1="570" x2="268" y2="570" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="274" y="482" width="194" height="176" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.3" />
  <g transform="translate(371, 516)" stroke="#059669" stroke-width="1.7" fill="#d1fae5">
    <line x1="-20" y1="-9" x2="0" y2="-12" />
    <line x1="-20" y1="-9" x2="0" y2="10" />
    <line x1="-16" y1="11" x2="0" y2="-12" />
    <line x1="-16" y1="11" x2="0" y2="10" />
    <line x1="0" y1="-12" x2="20" y2="-2" />
    <line x1="0" y1="10" x2="20" y2="-2" />
    <circle cx="-20" cy="-9" r="3.8" />
    <circle cx="-16" cy="11" r="3.8" />
    <circle cx="0" cy="-12" r="3.8" />
    <circle cx="0" cy="10" r="3.8" />
    <circle cx="20" cy="-2" r="3.8" />
  </g>
  <text x="371" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">2. Query Vector</text>
  <text x="371" y="571" text-anchor="middle" font-size="11" fill="#475569">Uses identical encoder</text>
  <text x="371" y="586" text-anchor="middle" font-size="11" fill="#475569">as ingestion stage</text>
  <rect x="288" y="606" width="166" height="32" rx="7" fill="#ecfdf5" />
  <text x="371" y="626" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#065f46">embed_query (384d)</text>

  <line x1="468" y1="570" x2="490" y2="570" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="496" y="482" width="194" height="176" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" />
  <g transform="translate(593, 516)">
    <rect x="-28" y="-15" width="56" height="8" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.3" />
    <rect x="-28" y="-4" width="56" height="8" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.3" />
    <rect x="-28" y="7" width="56" height="8" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.3" />
  </g>
  <text x="593" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">3. Top-k Retrieval</text>
  <text x="593" y="571" text-anchor="middle" font-size="11" fill="#475569">Fetches closest chunks</text>
  <text x="593" y="586" text-anchor="middle" font-size="11" fill="#475569">by cosine similarity</text>
  <rect x="510" y="606" width="166" height="32" rx="7" fill="#d1fae5" />
  <text x="593" y="626" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#065f46">retriever.invoke(k=4)</text>

  <line x1="690" y1="570" x2="712" y2="570" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="718" y="482" width="204" height="176" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.3" />
  <rect x="752" y="497" width="136" height="38" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4" />
  <text x="820" y="513" text-anchor="middle" font-size="10" font-family="monospace" font-weight="700" fill="#065f46">{context}</text>
  <text x="820" y="527" text-anchor="middle" font-size="10" font-family="monospace" fill="#047857">+ {question}</text>
  <text x="820" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">4. Prompt Augmentation</text>
  <text x="820" y="571" text-anchor="middle" font-size="11" fill="#475569">Injects retrieved chunks</text>
  <text x="820" y="586" text-anchor="middle" font-size="11" fill="#475569">&amp; context-only instructions</text>
  <rect x="732" y="606" width="176" height="32" rx="7" fill="#ecfdf5" />
  <text x="820" y="626" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#065f46">ChatPromptTemplate</text>

  <line x1="922" y1="570" x2="944" y2="570" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="950" y="482" width="204" height="176" rx="12" fill="#fffaf5" stroke="#fdba74" stroke-width="1.4" />
  <circle cx="1052" cy="516" r="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8" />
  <line x1="1044" y1="516" x2="1060" y2="516" stroke="#ea580c" stroke-width="2.2" />
  <line x1="1052" y1="508" x2="1052" y2="524" stroke="#ea580c" stroke-width="2.2" />
  <text x="1052" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">5. Grounded LLM</text>
  <text x="1052" y="571" text-anchor="middle" font-size="11" fill="#475569">Generates answer from</text>
  <text x="1052" y="586" text-anchor="middle" font-size="11" fill="#475569">retrieved evidence</text>
  <rect x="964" y="606" width="176" height="32" rx="7" fill="#ffedd5" />
  <text x="1052" y="626" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#9a3412">ChatGroq (gpt-oss-20b)</text>

  <line x1="1154" y1="570" x2="1176" y2="570" stroke="#475569" stroke-width="2.2" marker-end="url(#arrSlate)" />

  
  <rect x="1182" y="482" width="166" height="176" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.6" />
  <circle cx="1265" cy="516" r="17" fill="#d1fae5" stroke="#059669" stroke-width="1.8" />
  <path d="M 1258 516 L 1263 521 L 1273 511" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1265" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">6. Cited Answer</text>
  <text x="1265" y="571" text-anchor="middle" font-size="11" fill="#065f46">Factual, traceable,</text>
  <text x="1265" y="586" text-anchor="middle" font-size="11" fill="#065f46">&amp; low-hallucination</text>
  <rect x="1194" y="606" width="142" height="32" rx="7" fill="#ffffff" stroke="#6ee7b7" />
  <text x="1265" y="626" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">Evidence + Citations</text>

  
  
  
  <g filter="url(#cardShadow)">
    <rect x="32" y="700" width="1336" height="148" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />

    
    <text x="56" y="732" font-size="12.5" font-weight="700" fill="#1e3a8a">1. Why RAG?</text>
    <text x="56" y="754" font-size="11.5" fill="#334155">• Accesses private &amp; fresh data</text>
    <text x="56" y="773" font-size="11.5" fill="#334155">• Grounds facts in external text</text>
    <text x="56" y="792" font-size="11.5" fill="#334155">• Reduces uncalibrated guesses</text>
    <text x="56" y="818" font-size="10.5" font-weight="700" fill="#047857">Open-book vs. closed-book QA</text>

    <line x1="364" y1="718" x2="364" y2="830" stroke="#e2e8f0" stroke-width="1.5" />

    
    <text x="388" y="732" font-size="12.5" font-weight="700" fill="#4c1d95">2. Retrieval Mechanics</text>
    <text x="388" y="754" font-size="11.5" fill="#334155">• Sparse (TF-IDF/BM25) vs. Dense</text>
    <text x="388" y="773" font-size="11.5" fill="#334155">• Chunk size &amp; overlap balance</text>
    <text x="388" y="792" font-size="11.5" fill="#334155">• Eval: Precision@k, Recall, MAP</text>
    <text x="388" y="818" font-size="10.5" font-family="monospace" fill="#5b21b6">dim(index) == dim(encoder)</text>

    <line x1="698" y1="718" x2="698" y2="830" stroke="#e2e8f0" stroke-width="1.5" />

    
    <text x="722" y="732" font-size="12.5" font-weight="700" fill="#064e3b">3. Generation &amp; Citations</text>
    <text x="722" y="754" font-size="11.5" fill="#334155">• Conditions LLM on retrieved docs</text>
    <text x="722" y="773" font-size="11.5" fill="#334155">• Encourages explicit abstention</text>
    <text x="722" y="792" font-size="11.5" fill="#334155">• Adds source / page references</text>
    <text x="722" y="818" font-size="10.5" font-weight="700" fill="#047857">Eval: Exact Match &amp; token F1</text>

    <line x1="1032" y1="718" x2="1032" y2="830" stroke="#e2e8f0" stroke-width="1.5" />

    
    <text x="1056" y="732" font-size="12.5" font-weight="700" fill="#1d4ed8">4. LangGraph Evolution</text>
    <text x="1056" y="754" font-size="11.5" fill="#334155">• LangChain: modular RAG blocks</text>
    <text x="1056" y="773" font-size="11.5" fill="#334155">• LangGraph: StateGraph + TypedDict</text>
    <text x="1056" y="792" font-size="11.5" fill="#334155">• conditional_edge: grade &amp; retry</text>
    <text x="1056" y="818" font-size="10.5" font-family="monospace" fill="#1d4ed8">checkpointer for multi-turn state</text>
  </g>
</svg>