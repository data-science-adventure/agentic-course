[project]
name = "agentic-course"
version = "0.1.0"
description = "Hands-on course on building agents with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.2.0",
    "langchain-openai>=1.8.5",
    "langchain-pinecone==0.2.13",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=0.2.0",
    "pinecone>=6.0.0,<8.0.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Register CLI entrypoints for students to run via `uv run`
[project.scripts]
run-main = "agentic_course.main:main"
m1-intro = "agentic_course.module_01_basics.llm_intro:main"
m2-tools = "agentic_course.module_02_tools.simple_tools:main"
m2-multi-tool = "agentic_course.module_02_tools.multi_tool_agent:main"
m3-shopping-graph = "agentic_course.module_03_langgraph.shopping_state_graph:main"
